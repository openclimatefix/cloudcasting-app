# --- PROJECT CONFIGURATION --- #

[build-system]
requires = ["setuptools>=67", "wheel", "setuptools-git-versioning>=2.0,<3"]
build-backend = "setuptools.build_meta"

# Metadata (see https://peps.python.org/pep-0621/)
[project]
name = "cloudcasting-app"
dynamic = ["version"] # Set automtically using git: https://setuptools-git-versioning.readthedocs.io/en/stable/
description = "An app for running the OCF cloudcasting model in production"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12.0,<3.14"
license = {text = "MIT License"}
authors = [
    { name = "Open Climate Fix Team", email = "info@openclimatefix.org"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fsspec==2025.7.0",
    "huggingface-hub",
    "hydra-core",
    "icechunk",
    "loguru",
    "numpy",
    "ocf-data-sampler==1.0.23",
    "pandas",
    "pydantic-settings",
    "s3fs",
    "safetensors",
    # Pinned to a tag rather than a branch, so advancing it is a deliberate edit rather than
    # something an incidental re-lock does silently
    "sat_pred @ git+https://github.com/openclimatefix/sat_pred.git@v0.0.2",
    # pytorch is deliberately unconstrained: we inherit the version according to the version pin in
    # sat_pred. Inheriting the pin means models are always run with the same version of torch they
    # we trained with. All this app decides is that it wants the CPU build, via `tool.uv.sources`
    "torch",
    "xarray",
    "zarr",
]

[dependency-groups]
dev = [
    # Testing
    "pytest",
    "unittest-xml-reporting",
    # Linting and type checking
    "mypy >= 1.11.0",
    "ruff >= 0.6.4",
]

[project.scripts]
# Put entrypoints in here
cloudcasting-inference = "cloudcasting_inference.app:app"
cloudcasting-metrics = "cloudcasting_metrics.app:app"

[project.urls]
repository = "https://github.com/openclimatefix/cloudcasting-app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools-git-versioning]
enabled = true

# --- LINTING AND TYPING CONFIGURATION --- #

# MyPy configuration
# * See https://mypy.readthedocs.io/en/stable/index.html
[tool.mypy]
python_version = "3.12"
dmypy = true
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
plugins = [
    "numpy.typing.mypy_plugin",
]

# Ruff configuration
# * See https://beta.ruff.rs/docs/
[tool.ruff]
line-length = 100
indent-width = 4
# Scratch notebooks are not part of the packages and are not linted
exclude = ["__init__.py", "*.ipynb"]

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",   # whitespace and newlines
    "I",   # isort
    "UP",  # modernize
    "ANN", # flake8 type annotations
    "S",   # flake8 bandit
    "B",   # flake8 bugbear
    "C4",  # flake8 comprehensions
    "T20", # flake8 print
    "SIM", # flake8 simplify
    "ARG", # flake8 unused arguments
    "DTZ", # flake8 datetimes
    "Q",   # flake8 quotes
    "TCH", # flake8 typecheck
    "D",   # pydocstyle
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests are not documented or annotated, and `assert` is how they assert
"tests/*" = ["D", "ANN", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[[tool.uv.index]]
url = "https://pypi.org/simple"

# Production has no GPU, so torch is taken from the CPU-only index - the default PyPI wheels bundle
# CUDA and are several GB larger. `explicit` means only the packages named in `tool.uv.sources`
# below are looked for here, so everything else still resolves from PyPI
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
